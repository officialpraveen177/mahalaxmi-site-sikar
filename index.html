<script>
let currentTelegramUrl = "https://t.me/+KmY_WfdYhas3OTdl";

function trackTelegramContact() {
    if (typeof fbq === 'function') {
        fbq('track', 'Contact');
    }
}

function applyTelegramUrl(url) {
    if (!url) return;

    currentTelegramUrl = url;

    document.querySelectorAll('.tg-link-btn').forEach(btn => {
        btn.setAttribute('href', url);
        btn.setAttribute('target', '_blank');
        btn.setAttribute('rel', 'noopener noreferrer');
    });
}

document.addEventListener('DOMContentLoaded', function () {

    applyTelegramUrl(currentTelegramUrl);

    document.addEventListener('click', function(event) {

        const telegramButton =
            event.target.closest('.tg-link-btn');

        if (!telegramButton) return;

        trackTelegramContact();

    });

    const customInput =
        document.getElementById('custom-tg-url');

    if (customInput) {
        customInput.value = currentTelegramUrl;
    }

    const modalInput =
        document.getElementById('modal-tg-url');

    if (modalInput) {
        modalInput.value = currentTelegramUrl;
    }

});
</script>
